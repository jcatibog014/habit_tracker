{# The light/dark switch: a moon in light mode (press for dark), a sun in dark mode. CSS shows one. #}
<button type="button" class="icon-button" id="theme-toggle" aria-label="Switch to dark theme">
  <svg class="theme-icon icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
    <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="currentColor"/>
  </svg>
  <svg class="theme-icon icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
    <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
    <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"
          stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </svg>
</button>
